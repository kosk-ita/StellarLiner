<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar Liner</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    margin: 0;
    background: #0b0d14;
    color: #e8e6df;
    font-family: 'Courier New', ui-monospace, monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  main { padding: 2rem; max-width: 28rem; }
  h1 {
    font-weight: 400;
    letter-spacing: 0.08em;
    font-size: 1.4rem;
    margin: 0 0 0.5rem;
  }
  p.sub {
    color: #9a978c;
    font-size: 0.85rem;
    margin: 0 0 2rem;
  }
  a.watch {
    display: inline-block;
    padding: 0.75rem 1.75rem;
    border: 1px solid #b38b3a;
    border-radius: 2px;
    color: #d9c07a;
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: background 0.2s ease;
  }
  a.watch:hover { background: rgba(179, 139, 58, 0.12); }
  p.note { color: #55534a; font-size: 0.75rem; margin-top: 2rem; }
</style>
</head>
<body>
<main>
  <h1>Stellar Liner</h1>
  <p class="sub">tau Ceti sightseeing route</p>
  <a class="watch" href="https://drive.google.com/drive/folders/1ajWgjOl_tbLghQ5sW2oqTy8tfSeIi5Dz?usp=sharing" target="_blank" rel="noopener">watch the ride again</a>
  <p class="note">opens a Google Drive folder</p>
</main>
</body>
</html>
