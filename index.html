<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar Liner</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    background: #0b0d14;
    color: #e8e6df;
    font-family: 'Courier New', ui-monospace, monospace;
  }
  body { text-align: center; }
  main { padding: 2.5rem 1.5rem 3.5rem; max-width: 40rem; margin: 0 auto; }
  h1 {
    font-weight: 400;
    letter-spacing: 0.08em;
    font-size: 1.4rem;
    margin: 0 0 0.5rem;
  }
  p.sub {
    color: #9a978c;
    font-size: 0.85rem;
    margin: 0 0 2rem;
  }
  a.watch {
    display: inline-block;
    padding: 0.75rem 1.75rem;
    border: 1px solid #b38b3a;
    border-radius: 2px;
    color: #d9c07a;
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: background 0.2s ease;
  }
  a.watch:hover { background: rgba(179, 139, 58, 0.12); }
  p.note { color: #55534a; font-size: 0.75rem; margin: 0.75rem 0 0; }
  section.route { margin-top: 3rem; }
  h2 {
    font-weight: 400;
    letter-spacing: 0.05em;
    font-size: 0.95rem;
    color: #9a978c;
    margin: 0 0 0.75rem;
  }
  img.route-map {
    max-width: 100%;
    height: auto;
    border: 1px solid #23262f;
    border-radius: 2px;
  }
</style>
</head>
<body>
<main>
  <h1>Stellar Liner</h1>
  <p class="sub">tau Ceti sightseeing route</p>
  <a class="watch" href="https://youtu.be/NBrDS0ciWh4" target="_blank" rel="noopener">watch the ride again</a>
  <p class="note">opens on YouTube</p>
  <section class="route">
    <h2>route map</h2>
    <img class="route-map" src="img/route_map.png" alt="tau Ceti sightseeing route map">
  </section>
</main>
</body>
</html>
